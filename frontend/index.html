<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>
    <form id="form1" enctype="multipart/form-data" method="post" action="" class="form">
        <div class="row">
            <label for="fileToUpload">Selecione um arquivo para upload</label><br />
            <input type="file" name="fileToUpload" id="fileToUpload" />
        </div>
        <div id="fileName"></div>
        <div id="fileSize"></div>
        <div id="fileType"></div>
        <div class="row buttons">
            <button type="button" class="js-upload">Enviar</button>
            <button type="button" class="js-cancel">Cancelar</button>
        </div>
        <div id="progressNumber"></div>
    </form>

    <script src="http://localhost:8080/socket.io/socket.io.js"></script>
    <script src="/frontend/js/script.js" type="module"></script>
    <script src="./js/app.js"></script>
</body>
